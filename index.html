<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Navabe online bookstore" />
    <link rel="icon" type="image/svg+xml" href="/navabe-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      const savedTheme = localStorage.getItem("navabe-theme");
      const darkTheme = savedTheme
        ? savedTheme === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", darkTheme);
    </script>
    <title>Navabe Bookstore</title>
  </head>
  <body class="min-h-screen min-w-80 bg-canvas font-sans text-[17px] leading-[1.45] text-ink dark:bg-[#000000] dark:text-[#f2eee4] dark:[color-scheme:dark]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
